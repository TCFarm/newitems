/* ⭐ LAZY: the map's data is ~22 MB, so it is fetched only when the tab is first
   opened. ⛔ Never on page load — the review list must stay fast, and most
   sessions never open the map. */
let MAPDATA=null, MAPBUSY=false;
async function loadMarketMap(){
  if(MAPDATA) return MAPDATA;
  const ls=await graph(`/sites/${CFG.siteId}/drive/root:/${CFG.payloadDir}:/children?$select=name,id`);
  const f=(ls.value||[]).filter(x=>/^marketmap_.*\.json$/.test(x.name))
                        .sort((a,b)=>a.name<b.name?1:-1)[0];
  if(!f) throw new Error("no market map has been published yet");
  const t=await getToken();
  const r=await fetch(`${GRAPH}/sites/${CFG.siteId}/drive/items/${f.id}/content`,
                      {headers:{Authorization:"Bearer "+t}});
  if(!r.ok) throw new Error("market map download failed "+r.status);
  return (MAPDATA=await r.json());
}
async function renderMarketMap(el){
  if(MAPBUSY) return; MAPBUSY=true;
  el.innerHTML='<div class="center">Loading the market map… <span class="mut">'+
    '(about 22 MB, once per session)</span></div>';
  try{ const d=await loadMarketMap(); el.innerHTML=''; initMarketMap(el,d); }
  catch(e){ el.innerHTML='<div class="center">⛔ '+esc(e.message)+'</div>'; }
  finally{ MAPBUSY=false; }
}

/* ⭐ THE PER-ROW MAP. The same module and the same data, scoped to one product's
   shelf, opened with the candidate and our incumbents already selected.
   ⛔⛔ THIS MUST LIVE **BELOW** renderMarketMap: scripts/port_market_map.py
   replaces everything between `function initMarketMap` and the LAZY comment, and
   an earlier copy placed in that range was silently deleted by the next port.
   ⛔⛔ AND IT MUST NOT BUILD ON `open`. Every row's body sits in the DOM whether
   or not you are looking at it, so the sections ship OPEN but build only when
   they scroll into view — otherwise rendering the list would spin up 60 canvases
   and pull 23 MB before anyone asked for anything. */
async function buildRowMap(d){
  if(!d || d.dataset.done) return;
  d.dataset.done='1';
  const body=d.querySelector('.mapslot-body');
  body.innerHTML='<div class="center mut small">loading the market map… '+
    '<span class="mut">(about 23 MB, once per session)</span></div>';
  try{
    const data=await loadMarketMap();
    if(!d.open){ d.dataset.done=''; body.innerHTML=
      '<div class="center mut small">closed — open to load</div>'; return; }
    body.innerHTML='';
    initMarketMap(body, data, {sub:d.dataset.sub, focus:d.dataset.upc, compact:true});
  }catch(err){
    // ⛔ say why. A blank panel reads as "this item has no market data", which is a
    // different and far more misleading statement than "the fetch failed".
    body.innerHTML='<div class="center mut small">⛔ '+esc(err.message)+'</div>';
    d.dataset.done='';
  }
}
const mapSeen=new IntersectionObserver(es=>{
  for(const e of es){
    if(!e.isIntersecting) continue;
    mapSeen.unobserve(e.target);
    if(e.target.open) buildRowMap(e.target);
  }
}, {rootMargin:'200px'});     // ⭐ a little ahead of the scroll, not on top of it

/* ⭐ observe whatever the current render produced. `render()` replaces #main
   wholesale, so re-scan after every render rather than binding once. */
function watchRowMaps(){
  document.querySelectorAll('.mapslot:not([data-watched])').forEach(d=>{
    d.dataset.watched='1'; mapSeen.observe(d);
  });
}
// a manual open still works, for a section scrolled past while closed
document.addEventListener('toggle', e=>{
  const d=e.target;
  if(d instanceof HTMLElement && d.classList.contains('mapslot') && d.open) buildRowMap(d);
}, true);

document.getElementById("submit").addEventListener("click",async()=>{
  const btn=document.getElementById("submit"), s=document.getElementById("status");
  btn.disabled=true; s.textContent="submitting…";
  const id=await listId(); let ok=0,fail=0;
  for(const [upc,d] of Object.entries(DECIDED)){
    if(!d._dirty) continue;
    /* ⭐ second capture: whatever is on screen right now wins over what was
       recorded when the button was pressed. */
    const qEl=document.querySelector(`input[data-q="${CSS.escape(upc)}"]`);
    const nEl=document.querySelector(`textarea[data-n="${CSS.escape(upc)}"]`);
    // ⛔ final guard: never submit a quantity the vendor will not ship.
    if(qEl && qEl.value!==""){
      const inc=parseInt(qEl.dataset.inc||"1",10)||1;
      d.approved_qty=snapQty(Number(qEl.value),inc);
    }
    if(nEl) d.reviewer_note=nEl.value;
    const r=d._row||{};
    const f={Title:`${PAYLOAD.meta.order_sunday}:${upc}`,
      order_sunday:PAYLOAD.meta.order_sunday, period:PAYLOAD.meta.period, upc,
      brand:r.brand||"", item:r.description||"", subcategory:r.subcategory||"",
      storage:r.storage||"", rank:r.rank??null, score:r.score??null,
      gp_13wk:r.gp_13wk??null, price:r.price??null, regular_cost:r.regular_cost??null,
      promo_cost:r.promo_cost??null, proposed_qty:r.proposed_qty??null,
      proj_units_wk_calibrated:r.proj_units_wk_calibrated??null,
      p_clears_bar:r.p_clears_bar??null, carried_state:r.carried_state||"",
      on_promo:String(!!r.on_promo), buy_start:r.buy_start||"", buy_end:r.buy_end||"",
      /* ⭐⭐ THE DECISION RECORD IS A DATED SNAPSHOT OF WHAT THE REVIEWER SAW.
         ⛔ The schema had 20 of these columns and the page filled NONE of them, so
         every decision recorded WHAT was approved and almost nothing about WHY, or
         against which build. Backfilling later is guesswork about what was on
         screen at the time — so it is captured at the moment of the decision. */
      sku:r.lapsed_sku||"", unit_of_sale:r.unit_of_sale??null,
      shelf_weeks:r.shelf_weeks??null, promo_source:r.promo_source||"",
      nc_acv:r.nc_acv??null, nc_growth_pct:r.nc_growth_pct??null,
      our_units_wk_subcat:r.our_units_wk_subcat??null,
      proj_units_wk:r.proj_units_wk??null,
      proj_p10:r.proj_p10??null, proj_p90:r.proj_p90??null,
      min_units_wk:r.min_units_wk??null,
      bar_multiple_calibrated:r.bar_multiple_calibrated??null,
      margin_regular:r.margin_regular??null, margin_on_promo:r.margin_on_promo??null,
      price_basis:r.price_basis||"", regular_cost_basis:r.regular_cost_basis||"",
      why:(r.why||"").slice(0,255), why_not:(r.spins_why_not||"").slice(0,255),
      qty_why:(Array.isArray(r.proposed_qty_why)?r.proposed_qty_why.join(" · ")
               :(r.proposed_qty_why||"")).slice(0,255),
      research:(typeof r.stage2==="string"?r.stage2
                :r.stage2?JSON.stringify(r.stage2):"").slice(0,255),
      /* ⭐ the independent second opinion, and the four coded reasons behind it */
      market_score:r.market_score??null,
      market_score_why:[r.mkt_weeks_selling_bin,r.mkt_price_trend_bin,
                        r.mkt_acv_trend_bin,r.mkt_coast_lead_bin]
                       .filter(Boolean).join(" · ").slice(0,255),
      /* ⛔⛔ THE RISK FLAGS. Approving an item DESPITE "outside the model's
         evidence" is a different decision from approving a well-evidenced one, and
         without this the two are indistinguishable in the record forever. */
      risk_flags:[r.outside_launch_evidence?"outside-launch-evidence":"",
                  r.beyond_fitted_range?"beyond-fitted-range":"",
                  (r.nc_acv!=null&&r.nc_acv<10)?"thin-distribution":"",
                  r.distribution_trend==="BEING-DELISTED"?"being-delisted":"",
                  (r.weeks_selling_quad!=null&&r.weeks_selling_quad<=2)?"sporadic":"",
                  r.needs_price?"needs-price":"",
                  r.price_warning?"price-warning":""].filter(Boolean).join(" · ")||"none",
      loss_leader:r.loss_leader?(r.loss_leader.qualifies?"qualifies":"assessed, refused")+
                  (r.loss_leader.ratio!=null?` · ${r.loss_leader.ratio}x`:"")
                  +` · ${(r.loss_leader.failed||[]).join(",")}`.slice(0,120):"",
      /* ⭐ PROVENANCE: which market period and which build the reviewer saw, so a
         decision can be judged against the model as it WAS, not as it became. */
      spins_period:(PAYLOAD.meta.spins_state||{}).data_period_end||"",
      build_stamp:[PAYLOAD.meta.built_at||"",
                   (PAYLOAD.meta.spins_state||{}).projected_on?
                     "projected "+(PAYLOAD.meta.spins_state||{}).projected_on:"",
                   (PAYLOAD.meta.spins_state||{}).db_mtime||""]
                  .filter(Boolean).join(" · ").slice(0,255),
      decision:d.decision, approved_qty:d.approved_qty??null,
      reviewer:account, decided_at:new Date().toISOString().slice(0,19),
      reviewer_note:d.reviewer_note||""};
    /* ⛔ `drained` is set ONLY on a brand-new row. Sending it on a PATCH reset an
       already-drained decision, so the next drain re-processed it: the original
       queue line stayed pending AND a second one was created. 24 + 12 = 36 units
       ordered. Found by an independent review, 2026-09-04. */
    try{
      /* ⭐ idempotent on (order_sunday, upc): a second submit UPDATES. A
         duplicated approval would become a duplicated order. */
      const ex=DECIDED[upc]._id;
      if(ex) await graph(`/sites/${CFG.siteId}/lists/${id}/items/${ex}/fields`,
                         {method:"PATCH",body:JSON.stringify(f)});
      else {
        /* ⛔ CONCURRENT REVIEWERS: re-check by (order_sunday, upc) immediately
           before creating. Two people on the page at once would otherwise create
           two rows for one item and the drain would process both approvals. */
        const chk=await graph(`/sites/${CFG.siteId}/lists/${id}/items?expand=fields`
          +`&$top=200&$filter=fields/upc eq '${upc}'`).catch(()=>null);
        const dup=chk&&(chk.value||[]).find(x=>(x.fields||{}).order_sunday===PAYLOAD.meta.order_sunday);
        if(dup){
          await graph(`/sites/${CFG.siteId}/lists/${id}/items/${dup.id}/fields`,
                      {method:"PATCH",body:JSON.stringify(f)});
          DECIDED[upc]._id=dup.id;
        } else {
          const j=await graph(`/sites/${CFG.siteId}/lists/${id}/items`,
                              {method:"POST",body:JSON.stringify({fields:{...f,drained:"false"}})});
          DECIDED[upc]._id=j.id;
        }
      }
      DECIDED[upc]._dirty=false; ok++;
    }catch(err){ fail++; console.error(upc,err); }
  }
  s.textContent = fail?`⛔ ${ok} saved, ${fail} FAILED — see the console and retry`
                      :`✓ ${ok} decision(s) saved`;
  tally(); render();
});

/* ── boot ─────────────────────────────────────────────────────────────── */
(async()=>{
  const sub=document.getElementById("sub");
  try{
    if(!loadToken()){ if(!await completeLogin()){ await beginLogin(); return; } }
    sub.textContent="loading the week…";
    PAYLOAD=await loadPayload();
    ROWS=PAYLOAD.rows||[];
    DECIDED=await loadDecisions(PAYLOAD.meta.order_sunday);
    for(const k of Object.keys(DECIDED)) DECIDED[k]._row=ROWS.find(r=>r.upc===k);
    const m=PAYLOAD.meta;
    sub.textContent=`order ${m.order_sunday} · ${ROWS.length} candidates · `
      +`${(m.carried_counts||{}).lapsed||0} bring-backs · signed in as ${account}`;
    render();
  }catch(e){
    document.getElementById("main").innerHTML=
      `<div class="center">⛔ ${esc(e.message)}<br><br>
       <button onclick="sessionStorage.clear();location.href=location.pathname">sign in again</button></div>`;
    sub.textContent="not signed in";
  }
})();
</script>
