<script>
/* ── config ───────────────────────────────────────────────────────────────
   ⛔ The clientId and tenantId are NOT secrets — they identify the app, they do
   not authorise anything, and this is a PKCE SPA with no client secret. The data
   is protected by the SharePoint ACL, not by hiding these.
   ⚠️ The redirect URI for THIS page's exact URL must be registered on the Entra
   app or sign-in fails with AADSTS50011. See the README. */
const CFG = {
  clientId: "4a5939ef-bb89-4629-8a95-007509bb11a5",   /* "TC Farm Receiving" */
  tenantId: "c0f23c54-f515-4e2e-8aef-d3afb1ae34d0",
  siteId: "tcfarm0.sharepoint.com,d5fe3f11-af72-4c8b-b877-80e69226ca49,753c3608-e66a-4ec6-9fdf-5fb646ffa4fa",
  listName: "NewItemReview",
  payloadDir: "NewItemReview",
  scopes:["https://graph.microsoft.com/Sites.ReadWrite.All","offline_access","openid","profile"]
};
const AUTH=`https://login.microsoftonline.com/${CFG.tenantId}/oauth2/v2.0`;
const GRAPH="https://graph.microsoft.com/v1.0";
const store=sessionStorage;
let token=null,tokenExp=0,refreshTok=null,account="";
let PAYLOAD=null, ROWS=[], DECIDED={}, LISTID=null, TAB="reco";

/* ── auth: authorization code + PKCE (same shape as the receiving page) ── */
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);
  return Array.from(a,b=>("0"+b.toString(16)).slice(-2)).join("")};
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const sha256=async s=>crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
async function beginLogin(){
  const v=rand(64),c=b64url(await sha256(v)),st=rand(16);
  store.setItem("pkce_v",v);store.setItem("pkce_s",st);
  location.assign(`${AUTH}/authorize?`+new URLSearchParams({
    client_id:CFG.clientId,response_type:"code",
    redirect_uri:location.origin+location.pathname,response_mode:"query",
    scope:CFG.scopes.join(" "),code_challenge:c,code_challenge_method:"S256",state:st}));
}
async function completeLogin(){
  const q=new URLSearchParams(location.search),code=q.get("code");
  if(q.get("error")) throw new Error(`${q.get("error")}: ${q.get("error_description")||""}`);
  if(!code) return false;
  if(q.get("state")!==store.getItem("pkce_s")) throw new Error("state mismatch — restart sign-in");
  const r=await fetch(`${AUTH}/token`,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CFG.clientId,grant_type:"authorization_code",code,
      redirect_uri:location.origin+location.pathname,code_verifier:store.getItem("pkce_v")})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"token exchange failed");
  setToken(j); history.replaceState({},"",location.pathname); return true;
}
function setToken(j){
  token=j.access_token; tokenExp=Date.now()+(j.expires_in||3600)*1000-60000;
  if(j.refresh_token) refreshTok=j.refresh_token;
  try{account=JSON.parse(atob(j.id_token.split(".")[1])).preferred_username||"";}catch(_){}
  store.setItem("tok",JSON.stringify({t:token,e:tokenExp,r:refreshTok,a:account}));
}
function loadToken(){try{const s=JSON.parse(store.getItem("tok")||"null");if(!s)return false;
  token=s.t;tokenExp=s.e;refreshTok=s.r;account=s.a||"";return Date.now()<tokenExp;}catch(_){return false}}
async function getToken(){
  if(token&&Date.now()<tokenExp) return token;
  if(refreshTok){
    const r=await fetch(`${AUTH}/token`,{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:CFG.clientId,grant_type:"refresh_token",
        refresh_token:refreshTok,scope:CFG.scopes.join(" ")})});
    const j=await r.json(); if(r.ok){setToken(j);return token;}
  }
  throw new Error("session expired — reload and sign in again");
}
async function graph(path,opts={}){
  const t=await getToken();
  const r=await fetch(GRAPH+path,{...opts,headers:{...(opts.headers||{}),
    Authorization:"Bearer "+t,"Content-Type":"application/json"}});
  const txt=await r.text(); let j=null; try{j=txt?JSON.parse(txt):null}catch(_){}
  if(!r.ok) throw new Error((j&&(j.error?.message||j.error_description))||`${r.status} on ${path}`);
  return j;
}

/* ── data ─────────────────────────────────────────────────────────────── */
const fmt=(v,d=2)=>v===null||v===undefined||v===""?"—":Number(v).toFixed(d);
const money=v=>v===null||v===undefined||v===""?"—":"$"+Number(v).toFixed(2);
const pct=v=>v===null||v===undefined||v===""?"—":(Number(v)*100).toFixed(0)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadPayload(){
  /* newest payload in the folder — ⛔ never a hardcoded date, so the page shows
     whatever the latest build published rather than silently going stale. */
  const ls=await graph(`/sites/${CFG.siteId}/drive/root:/${CFG.payloadDir}:/children?$select=name,id`);
  const files=(ls.value||[]).filter(f=>/^payload_.*\.json$/.test(f.name))
                            .sort((a,b)=>a.name<b.name?1:-1);
  if(!files.length) throw new Error("no payload has been published yet");
  const t=await getToken();
  const r=await fetch(`${GRAPH}/sites/${CFG.siteId}/drive/items/${files[0].id}/content`,
                      {headers:{Authorization:"Bearer "+t}});
  if(!r.ok) throw new Error("payload download failed "+r.status);
  return await r.json();
}
async function listId(){
  if(LISTID) return LISTID;
  const j=await graph(`/sites/${CFG.siteId}/lists?$select=displayName,id`);
  const l=(j.value||[]).find(x=>x.displayName===CFG.listName);
  if(!l) throw new Error(`list ${CFG.listName} not found`);
  return (LISTID=l.id);
}
async function loadDecisions(sunday){
  const id=await listId();
  let url=`/sites/${CFG.siteId}/lists/${id}/items?expand=fields&$top=500`, out={};
  while(url){
    const j=await graph(url);
    for(const it of j.value||[]){
      const f=it.fields||{};
      if(f.order_sunday===sunday) out[f.upc]={...f,_id:it.id};
    }
    const n=j["@odata.nextLink"]; url=n?n.replace(GRAPH,""):null;
  }
  return out;
}


/* ── ⭐ SUMMARISE, DO NOT DUMP (Jack, 2026-09-04: "it's just kind of a bunch of
   garbage ... needs to be summarized in a concise manner to be realistic for
   someone to read and get the information they need in one go").
   ⛔ The first build rendered `why_not` with JSON.stringify — four lines of raw
   objects a human cannot read. These turn the same data into sentences. ── */

const num = v => v===null||v===undefined||v===""?null:Number(v);

/* ⭐⭐ THE ORDERABLE INCREMENT (Jack, 2026-09-04: "this lets me adjust quantities by
   the individual units when this item probably needs to be ordered by the case").
   ⛔ `UNIT_OF_SALE` is the orderable MINIMUM — the smallest quantity KeHE will
   ship. `CASEPACK` is the MASTER case and is always a multiple of it.
   ⛔ NEVER fall back `unit_of_sale || casepack`: that picks the LARGER increment
   exactly when you know least, and turns a need for 12 into an order for 144.
   The fallback is 1, and the row SAYS the increment is unknown. */
function orderInc(r){
  const v = String(r.unit_of_sale ?? "").trim().toUpperCase();
  if(["EA","EACH","EAC","UN","UNIT"].includes(v)) return {inc:1, known:true};
  const n = parseInt(v,10);
  if(Number.isFinite(n) && n >= 1) return {inc:n, known:true};
  return {inc:1, known:false};
}
/* round UP to the next orderable multiple — never down, or the order is short */
const snapQty = (v,inc) => (!Number.isFinite(v)||v<=0) ? inc : Math.max(inc, Math.ceil(v/inc)*inc);

/* one plain sentence: will it sell, and how sure are we */
function sellLine(r){
  const u=num(r.proj_units_wk_calibrated), lo=num(r.proj_p10), hi=num(r.proj_p90),
        bar=num(r.min_units_wk), p=num(r.p_clears_bar);
  if(u===null) return "No velocity projection — this item cannot be sized from the market data.";
  let t=`Expect about <b>${u.toFixed(1)} a week</b>`;
  if(lo!==null&&hi!==null) t+=` (could be ${lo.toFixed(1)}–${hi.toFixed(1)})`;
  if(bar!==null) t+= u>=bar ? `, above the ${bar.toFixed(1)}/wk floor for its department`
                            : `, <b>below</b> the ${bar.toFixed(1)}/wk floor for its department`;
  if(p!==null) t+=` — ${Math.round(p*100)}% of items like this clear that floor.`;
  else t+=".";
  /* ⛔ NEVER TELL THE REVIEWER TO ADJUST THE NUMBER (ruling: Jack, 2026-09-04):
     "the qty recommended should be adjusted at the first pass, not telling the
     user to adjust it - it is unclear what even to adjust to or why a user would
     know better without having a good starting point." This used to end "so treat
     it as a hypothesis and buy small", which is an instruction for something
     newitem_qty ALREADY did (beyond_fitted_cover_weeks cuts cover to 3). State
     what the model did; the number on the row is the answer. */
  if(r.beyond_fitted_range) t+=` This projection is beyond anything the model was fitted on`
    + (r.max_fitted_proj?` (max ${num(r.max_fitted_proj).toFixed(1)}/wk)`:``)
    + `, so the buy below is already sized as a probe rather than a forecast.`;
  return t;
}

/* one plain sentence: what we make on it */
function moneyLine(r){
  const pr=num(r.price), mg=num(r.margin_regular), sp=num(r.sale_price),
        sm=num(r.sale_margin), rc=num(r.regular_cost), pc=num(r.promo_cost);
  if(pr===null) return "⛔ No price — we could not check whether the margin works.";
  let t=`Sell at <b>${money(pr)}</b>`;
  if(rc!==null) t+=` on a ${money(rc)} cost`;
  if(mg!==null) t+=` — <b>${Math.round(mg*100)}% margin</b>`;
  t+=".";
  if(sp!==null) t+=` On promo: ${money(sp)}`+(sm!==null?` (${Math.round(sm*100)}% margin)`:``)
    +(pc!==null?` while it costs ${money(pc)}`:``)+`.`;
  return t;
}

/* one plain sentence: the buy */
function buyLine(r){
  const q=r.proposed_qty, u=num(r.proj_units_wk_calibrated);
  if(q===null||q===undefined) return "";
  const wks = (u&&u>0) ? (q/u) : null;
  let t=`Buy <b>${q}</b>`;
  if(wks) t+=` — about ${wks.toFixed(0)} week${wks>=1.5?"s":""} of cover`;
  const cost=num(r.promo_cost)||num(r.regular_cost);
  if(cost) t+=`, roughly ${money(q*cost)} committed`;
  t+=".";
  /* ⛔⛔ NEVER TELL THE REVIEWER TO ADJUST THE NUMBER (ruling: Jack, 2026-09-04):
     "these should never be there - the qty recommended should be adjusted at the
     first pass, not telling the user to adjust it - it is unclear what even to
     adjust to or why a user would know better without having a good starting
     point." This read "Cut back so it clears before it dates out" - an instruction
     for something newitem_qty had ALREADY done, sitting next to a shelf-life line
     saying the quantity clears comfortably. The two contradicted each other and
     neither said what to change it to. Now it states the cap as a fact, with the
     numbers, so the reviewer can see WHY 6 and not 10. */
  const cap=(r.proposed_qty_why||[]).find(w=>/sized down|DATING CAP/i.test(String(w)));
  if(cap) t+=" "+esc(String(cap).replace(/^[^A-Za-z]*/,"")
                                .replace(/^DATING CAP:\s*/i,"Sized down by shelf life: "))
                                .replace(/^s/,"S")+".";
  return t;
}

/* ⭐⭐ THE OBJECTIVE, SHOWN. BUSINESS-GOALS.md says the metric is grocery attach
   and BASKET SIZE, not gross profit per SKU - and yet households reached was the
   one number the pane never displayed (found 2026-09-04). A model that ranks on
   something it never shows cannot be argued with. */
function reachLine(r){
  const h=num(r.households_wk), u=num(r.proj_units_wk_calibrated);
  if(h===null) return "";
  let t=`Reaches about <b>${h.toFixed(1)} household${h>=1.5?"s":""} a week</b>`;
  if(u&&u>0) t+=` (${(h/u).toFixed(2)} per unit sold)`;
  t+=".";
  /* ⭐ THE CONTEXT THAT MAKES THE NUMBER MEAN SOMETHING. A unit is not a
     household: in MODERN SODA people buy roughly four at a time, so volume there
     buys almost no reach, while in BREAD LOAVES it is close to one to one.
     Measured per subcategory by lib/newitem_reach. */
  const P=(PAYLOAD&&PAYLOAD.meta&&PAYLOAD.meta.peers)||{}, b=P[r.subcategory], rc=b&&b.reach;
  if(rc&&rc.hh_per_unit!=null){
    const hp=Number(rc.hh_per_unit);
    t+=` In ${esc(r.subcategory||"this subcategory")} a unit reaches ${hp.toFixed(2)} households`;
    t+= hp>=0.7 ? ` — people buy close to one at a time here, so volume does mean reach.`
       : hp<=0.4 ? ` — people buy several at a time here, so volume buys little reach.`
       : ` — partway between volume and reach.`;
    if(rc.households_wk_total!=null&&rc.n_live)
      t+= rc.n_live===1
        ? ` The one live item on this shelf reaches about <b>${Number(rc.households_wk_total).toFixed(1)}</b> households a week.`
        : ` The ${rc.n_live} live items on this shelf reach about <b>${Number(rc.households_wk_total).toFixed(1)}</b> households a week between them.`;
  }
  return t;
}

/* ⭐ THE DEADLINE. The ranking multiplies by "first chance to buy on this promo"
   but the pane never said WHEN the window closes, so the reviewer could not see
   that a yes next week costs regular price. */
function windowLine(r){
  if(!r.on_promo && !r.buy_end) return "";
  const bits=[];
  if(r.buy_start||r.buy_end) bits.push(`Deal window ${esc(r.buy_start||"?")} to ${esc(r.buy_end||"?")}`);
  const w=num(r.promo_weeks);
  if(w!==null&&w>0) bits.push(`<b>${w.toFixed(0)} week${w>=1.5?"s":""}</b> of buying left`);
  if(!bits.length) return "";
  let t=bits.join(" &middot; ")+".";
  if(w!==null&&w<=1) t+=" ⚠️ This is the last order that gets the deal cost.";
  return t;
}

/* ⭐ THE RISK THE BUY LINE ONLY HINTED AT. "Cut back so it clears before it dates
   out" never said how long the item actually lasts. */
function lifeLine(r){
  const w=num(r.shelf_weeks);
  if(w===null) return `Shelf life unknown, so the dating cap could not be applied — treat a large first buy as the risk.`;
  let t=`Shelf life about <b>${w.toFixed(0)} week${w>=1.5?"s":""}</b>`;
  const q=r.proposed_qty, u=num(r.proj_units_wk_calibrated);
  if(q&&u&&u>0){ const cov=q/u;
    t+= cov>w ? `; the proposed ${q} is <b>${cov.toFixed(0)} weeks of cover</b>, longer than that.`
              : `; the proposed ${q} clears in about ${cov.toFixed(0)}.`; }
  else t+=".";
  return t;
}

/* ⭐ WHAT COMPETITORS CHARGE. ⛔ The RAW per-retailer readings are the point:
   ProductPipeline consumes them when it builds the product and a human may
   decide a different price there (Jack, 2026-09-04). Our cap is advisory and is
   labelled as such. ⛔ Every reading shows its AGE - a competitor price is a fact
   with a date, and this one limits what we charge. */
function compLine(r){
  const c=r.competitor_prices;
  if(!c||!Object.keys(c).length) return "";
  const order=["lakewinds","wholefoods","target"];
  const nice={lakewinds:"Lakewinds",wholefoods:"Whole Foods",target:"Target"};
  const bits=Object.keys(c).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(k=>{
    const v=c[k], exact=v.match_type==="upc_exact";
    if(v.price==null) return `${nice[k]||k} <span class="mut">no match</span>`;
    return `${nice[k]||k} <b>${money(v.price)}</b>`+
      (exact?"":' <span class="mut">(name match — not used for pricing)</span>')+
      (v.age_days!=null?` <span class="mut">${v.age_days===0?"today":v.age_days+"d old"}</span>`:"");
  });
  let t=`Competitors: ${bits.join(" &middot; ")}.`;
  const cap=r.competitor_cap;
  if(cap){
    t+=` Advisory cap <b>${money(cap.price)}</b> — ${esc(cap.basis)}`+
       (cap.confidence&&cap.confidence!=="high"?` <b>(${esc(cap.confidence)} confidence)</b>`:"")+".";
    if(r.price&&cap.price&&r.price>cap.price)
      t+=` <b>Our ${money(r.price)} is above it.</b>`;
  } else {
    t+=` <span class="mut">No UPC-exact match, so no competitor cap — priced on cost and category margin.</span>`;
  }
  return t;
}

/* ⭐ %ACV on the collapsed row — the share of North Central stores carrying it.
   ⛔ Bands are the MEASURED percentiles of the scored universe (median 8%, top-60
   median 18%, 40% of rows under 5%), not round numbers someone liked. */
/* ⛔ NEVER ROUND A POSITIVE NUMBER TO ZERO (found 2026-09-04: Live More Organics
   is carried in 0.2% of stores and rendered as "0%", which reads as "carried
   nowhere" — a different and much stronger claim than "barely carried"). */
// ⭐⭐ LOSS LEADER — shown ONLY where there was a real decision to make. A row with
// no competitor price is not a loss-leader question, and labelling all 3,700 of
// them would bury the handful that are.
// ⛔ It shows the REFUSALS too, with the binding reason. A model that only ever
// displays its approvals teaches the reader nothing about where its line sits,
// and this one refuses far more often than it approves.
const LL_LABEL={price_visible:"Can a customer price-check us?",
  full_shop_marker:"Does this shelf mark a full shop?",
  not_already_theirs:"Do specialty households NOT already buy it?",
  basket_anchor:"Is the rest of the shop bigger with it?",
  has_a_price_cut:"Is there actually a price cut?",
  pays_for_itself:"Does the basket beat the margin we give up?",
  budget:"Is there budget left?",
  per_department:"Room left in this department?"};
function llBanner(r){
  const a=r.loss_leader; if(!a) return "";
  const rows=Object.keys(a.conditions||{}).map(k=>{
    const c=a.conditions[k], ok=c.ok===true, unk=c.ok===null;
    return `<tr><td style="white-space:nowrap">${unk?"❔":ok?"✅":"⛔"} ${esc(LL_LABEL[k]||k)}</td>`
         + `<td class="mut">${esc(c.why||"")}</td></tr>`;}).join("");
  const head = a.qualifies
    ? `⭐ <b>Worth carrying at a thin margin.</b> Returns <b>${a.ratio}\u00d7</b> the gross`
      + ` profit we give up, costing <b>${money(a.weekly_gp_cost)}/wk</b> of the`
      + ` ${money(a.budget_per_week)} weekly budget.`
    : `<b>Not a loss leader.</b> ${esc((a.conditions[(a.failed||[])[0]]||{}).why||"")}`;
  return `<div class="banner"${a.qualifies?' style="background:#eefaf0;border-color:#bfe3c8;color:#1a6b32"':''}>`
       + `${head}<details style="margin-top:6px"><summary class="mut small">`
       + `all ${Object.keys(a.conditions||{}).length} tests</summary>`
       + `<table class="small" style="margin-top:6px">${rows}</table>`
       + `<p class="mut small">⚠️ The basket figure is a CORRELATION measured on households who`
       + ` already buy this shelf. Only a deliberate price test proves a discount causes it.</p>`
       + `</details></div>`;
}
function acvPct(v){
  const a=num(v);
  if(a==null) return "&mdash;";
  if(a<=0) return "0%";
  if(a<1) return "&lt;1%";
  return Math.round(a)+"%";
}

/* ⭐ THE ARROW (Jack, 2026-09-04). ⛔ From SPINS' PRE-COMPUTED nc_acv_growth_pct
   and nothing else — every _yago field pairs with its _quad companion, and
   dividing it by the 12-week figure on the same row reads +151% on a row whose
   true move is -20%. That trap is SPINS' own; do not re-derive this. */
function acvArrow(r){
  const g=num(r.nc_acv_growth_pct);
  if(g==null) return "";
  if(g>=5) return ' <span class="arw up">&#9650;</span>';
  if(g<=-5) return ' <span class="arw dn">&#9660;</span>';
  return ' <span class="arw fl">&#9644;</span>';
}
function acvSub(r){
  const g=num(r.nc_acv_growth_pct), a=num(r.nc_acv);
  const base=a==null?"":a<5?"barely distributed":a<20?"narrow":"widely carried";
  if(g==null) return base;
  return `${base} &middot; ${g>0?"+":""}${Math.round(g)}% in a year`;
}
const TRENDS={"BEING-DELISTED":["being delisted","bad"],
  "CONTRACTING":["contracting","bad"],
  "EXPANDING-BUT-THINNING":["expanding, thinning","warn"],
  "EXPANDING-AND-HOLDING":["expanding","good"],
  "STEADY-BUT-ACCELERATING":["steady, selling faster","good"],
  "STEADY":["steady",""],"no-year-ago-data":["no year-ago data",""]};
function trendShort(t){ return (TRENDS[t]||[t||null,""])[0]; }
function trendCls(t){ return (TRENDS[t]||["",""])[1]; }

function acvCls(r){
  const a=num(r.nc_acv);
  if(a==null) return "unk";
  return a<5 ? "bad" : a<20 ? "warn" : "ok";
}
function acvText(r){
  const a=num(r.nc_acv);
  return a==null ? "%ACV &mdash;" : `${acvPct(a)} of stores`;
}

/* ⭐ ONE TILE. `cls` colours it only when the number demands an action. */
function tile(v, label, sub, cls){
  return `<div class="t ${cls||""}${v==null||v===""?" dim":""}">
    <b>${v==null||v===""?"&mdash;":v}</b><s>${label}</s>${sub?`<i>${sub}</i>`:""}</div>`;
}

/* ⛔⛔ THE SAME EIGHT TILES, THE SAME ORDER, EVERY PRODUCT. A reviewer working 50
   rows should learn the layout once and then read only what changed. ⛔ Never
   hide a tile because its value is missing - show a dash. A grid that reflows per
   product is exactly what made the prose version unreadable. */
function tiles(r){
  const u=num(r.proj_units_wk_calibrated), lo=num(r.proj_p10), hi=num(r.proj_p90),
        bar=num(r.min_units_wk), p=num(r.p_clears_bar), h=num(r.households_wk),
        pr=num(r.price), mg=num(r.margin_regular), sp=num(r.sale_price),
        sm=num(r.sale_margin), sw=num(r.shelf_weeks), q=r.proposed_qty,
        acv=num(r.nc_acv), g=num(r.nc_growth_pct),
        foc=num(r.first_order_cost), cap=r.competitor_cap, w=num(r.promo_weeks);
  const cover=(q&&u&&u>0)?q/u:null;
  const over=cap&&pr&&pr>cap.price;
  return `<div class="tiles">
    ${tile(u!=null?u.toFixed(1):null,"units / wk",
           lo!=null&&hi!=null?`range ${lo.toFixed(1)}\u2013${hi.toFixed(1)}`:"",
           bar!=null&&u!=null?(u>=bar?"good":"warn"):"")}
    ${tile(h!=null?h.toFixed(1):null,"households / wk",
           u&&h!=null?`${(h/u).toFixed(2)} per unit`:"")}
    ${tile(p!=null?Math.round(p*100)+"%":null,"clear the floor",
           bar!=null?`floor ${bar.toFixed(1)}/wk`:"", p!=null?(p>=0.5?"good":p<0.25?"bad":"warn"):"")}
    ${tile(sw!=null?sw.toFixed(0)+" wk":null,"shelf life",
           cover?`${q} clears in ${cover.toFixed(0)}`:"",
           sw!=null&&cover?(cover>sw?"bad":"") :"")}
    ${/* ⛔ "our price" tile CUT (Jack, 2026-09-05) — the price is already in the
          row header a few centimetres away, so the tile spent a slot restating
          it. ⭐ Its one unique figure, the REGULAR margin, moved onto the header
          line beside the price so nothing is lost. */""}
    ${tile(sp!=null?money(sp):null,"on promo",
           sm!=null?`${Math.round(sm*100)}% margin`:"")}
    ${/* ⛔ "first order" tile dropped (Jack, 2026-09-04) — the quantity is already
          in the row control at the top and the committed dollars are in "every
          factor and figure", so it spent a tile restating what is on screen.
          ⭐ Replaced by the market trend, which was only visible inside the peer
          table and is a top-level decision input.
          ⚠️ LABELLED HONESTLY: nc_growth_pct is the latest 13-week SPINS period
          against the SAME period a YEAR AGO — it is year-over-year, not "the last
          13 weeks". Our own peer column is 13wk vs the PRIOR 13wk, a different
          basis, and calling both "13wk" implied they were comparable. */
      tile(g!=null?(g>0?"+":"")+g.toFixed(0)+"%":null,"SPINS trend",
           "13wk vs a year ago", g!=null?(g>=25?"good":g<=-10?"bad":""):"")}
    ${tile(w!=null&&w>0?w.toFixed(0)+" wk":(r.on_promo?"now":null),"deal left",
           r.buy_end?`ends ${esc(r.buy_end)}`:"", w!=null&&w<=1?"warn":"")}
    ${/* ⭐ %ACV — how much of the region actually carries it (Jack, 2026-09-04:
          "the percentage of stores in the north central region carrying the SKU -
          like this one seems questionable to add"). ⛔ A projection built on a
          handful of stores is a different animal from one built on half the
          region, and no other tile says which. Bands are measured, not invented:
          across 3,461 scored rows the median is 7.8 and the top-60 median 17.6. */
      tile(acv!=null?acvPct(acv)+acvArrow(r):null,"of N.Central stores",
           acvSub(r), acv!=null?(acv<5?"bad":acv<20?"warn":"good"):"")}
    ${/* ⭐ SPINS' own classification of what distribution is DOING. ⛔ BEING-DELISTED
          is the one that changes a decision outright: other retailers are dropping
          it. ⚠️ 660 of this week's 3,737 candidates carry it. */
      tile(trendShort(r.distribution_trend),"distribution",
           r.nc_acv_growth_pct!=null?`${r.nc_acv_growth_pct>0?"+":""}${Math.round(r.nc_acv_growth_pct)}% ACV vs last year`:"",
           trendCls(r.distribution_trend))}
    ${/* ⭐⭐ THE SECOND AXIS. ⛔ READ IT AS DISTRIBUTION ARRIVING, NOT VELOCITY —
          SPINS corrected their own "2.5x forward units" headline on 2026-09-05:
          that figure had no volume control. What holds inside every volume band
          is forward SHELF gain (+0.561 ACV points against -0.036 for no lead).
          ⛔ A NULL IS NOT A ZERO: null means SPINS has no coastal row at all,
          which measured WORSE than a zero lead. */
      tile(r.coast_lead_pts==null?null:(r.coast_lead_pts>0?"+":"")+Math.round(r.coast_lead_pts)+"pt",
           "coast lead",
           r.coast_lead_pts==null?"no coastal read"
             :r.coast_lead_pts>=10?"the wave is heading here"
             :r.coast_lead_pts<=-10?"we are ahead of the coasts":"in step with the coasts",
           r.coast_lead_pts==null?"":(r.coast_lead_pts>=10?"good":""))}
    ${/* ⭐⭐ THE STRONGEST PREDICTOR SPINS FOUND. Sporadic selling at real volume
          is a discontinuation in progress — a MEDIAN OF ZERO units six quads on. */
      tile(r.weeks_selling_quad==null?null:r.weeks_selling_quad+" of 4",
           "weeks selling",
           r.weeks_selling_quad==null?""
             :r.weeks_selling_quad>=4?"sells every week"
             :r.weeks_selling_quad<=2?"sporadic — a delist signal":"patchy",
           r.weeks_selling_quad==null?"":(r.weeks_selling_quad>=4?"good"
             :r.weeks_selling_quad<=2?"bad":"warn"))}
  </div>`;
}

/* ⭐ THE COMPETITOR STRIP. Always all three retailers, always the same order, so
   "Lakewinds no match" is read at a glance rather than hunted for in a sentence. */
/* ⭐⭐ SPINS' SECOND OPINION. Fitted on the market panel with NONE of our own
   sales, so it is genuinely independent of our score — and it disagrees often.
   ⛔⛔ SHOWN AS A BAND, NEVER AS A RANK. 117 distinct values across 3,403 items
   and 277 of them (8%) share the top value, so "3rd best by market score" is an
   arbitrary slice of a tie. ⛔ And never averaged with our score: r=0.02 between
   them, so a blend destroys the disagreement, which is the only thing it adds. */
const MKT_BINS={weeks:"weeks selling",price:"price trend",acv:"distribution",coast:"coast lead"};
function mktBand(v){
  if(v==null) return null;
  if(v>=1.0)  return ["strong","good"];
  if(v>=0.4)  return ["positive","good"];
  if(v>=-0.2) return ["neutral",""];
  if(v>=-1.0) return ["weak","warn"];
  return ["poor","bad"];
}
function mktPanel(r){
  const b=mktBand(r.market_score);
  if(!b) return "";
  const why=[["weeks",r.mkt_weeks_selling_bin],["price",r.mkt_price_trend_bin],
             ["acv",r.mkt_acv_trend_bin],["coast",r.mkt_coast_lead_bin]]
    .filter(x=>x[1]&&!/unknown|no_coast_row/i.test(x[1]))
    .map(x=>`${MKT_BINS[x[0]]}: <b>${esc(String(x[1]).replace(/_/g," "))}</b>`).join(" · ");
  // ⛔ name the disagreement when there is one — that is the whole point of a
  // second axis, and a reader who only sees agreement learns nothing from it.
  const ours=r.rank!=null&&r.rank<=60, mkt=r.market_score>=1.0;
  const clash = ours&&r.market_score<-0.2 ? " ⚠️ <b>We rank this highly and the market panel does not.</b>"
              : (!ours&&mkt) ? " ⭐ <b>The market panel rates this well above where we rank it.</b>" : "";
  const cls=b[1]==="bad"?"chip bad":b[1]==="good"?"chip good":b[1]==="warn"?"chip warnc":"chip";
  return `<div class="chips"><span class="${cls}">market panel: ${b[0]}</span>
    <span class="mut small" style="align-self:center">${why||"no reasons coded"}${clash}
      &middot; independent of our score, fitted with none of our own sales</span></div>`;
}
function compStrip(r){
  const order=[["lakewinds","LW"],["wholefoods","WF"],["target","TGT"]];
  const c=r.competitor_prices||{}, cap=r.competitor_cap, pr=num(r.price);
  const pills=order.map(([k,lbl])=>{
    const v=c[k];
    if(!v||v.price==null) return `<span class="cp none"><span class="r">${lbl}</span>no match</span>`;
    const exact=v.match_type==="upc_exact";
    return `<span class="cp${exact?" hit":""}"><span class="r">${lbl}</span>${money(v.price)}${
      exact?"":" <span class=\"mut\">name</span>"}${
      v.age_days?` <span class="mut">${v.age_days}d</span>`:""}</span>`;
  }).join("");
  let verdict;
  if(!cap) verdict=`<span class="verdict none">no UPC match &middot; priced on cost + margin</span>`;
  else if(pr!=null&&pr>cap.price)
    verdict=`<span class="verdict over">${money(pr-cap.price)} over ${money(cap.price)}${
      cap.confidence==="high"?"":" &middot; "+esc(cap.confidence)}</span>`;
  else verdict=`<span class="verdict ok">at or under ${money(cap.price)}</span>`;
  return `<div class="comp">${pills}${verdict}</div>`;
}

/* the single strongest reason it sits where it does */
function rankLine(r){
  const c=(r.components||[]).filter(x=>Array.isArray(x)&&x[1]!==1);
  if(!c.length) return "Ranked on expected households reached, with nothing pushing it up or down.";
  c.sort((a,b)=>Math.abs(Math.log(b[1]||1))-Math.abs(Math.log(a[1]||1)));
  const label={confidence:"confidence in the projection",trend:"market trend",
    diversity:"it fills a gap we do not serve",promo_first:"first chance to buy it on this promo",
    storage_scarcity:"storage space",crowding:"how many we have already picked here"};
  return c.slice(0,3).map(([k,v])=>
    `${label[k]||k} <b>${v>1?"×":"÷"}${(v>1?v:1/v).toFixed(2)}</b>`).join(" · ");
}

/* ⭐ SPINS gate failures as ENGLISH, not JSON */
/* WHAT IS THIS THING - one plain sentence, at the very top of the detail
   (Jack, 2026-09-04). Written by the build from the manufacturer's own copy;
   a row without copy shows nothing rather than an invented sentence. */
function whatIs(r){
  if(!r.what_it_is) return "";
  /* ⛔ Allergens dropped (Jack, 2026-09-04: "you can cut allergen line"). RIVIR
     returned a blank allergen string on every row, so it was a label with nothing
     behind it. Filtered here too, so an older payload cannot resurrect it. */
  const fx=(r.what_it_is_facts||[]).filter(p=>String(p[0]).toLowerCase()!=="allergens")
     .map(p=>`<b>${esc(p[0])}:</b> ${esc(p[1])}`).join(" &middot; ");
  return `<div class="whatis">${esc(r.what_it_is)}${fx?`<span class="fx">${fx}</span>`:""}</div>`;
}

/* WHAT WE ALREADY SELL HERE (Jack, 2026-09-04): "make a drop down that compiles
   the key information about the other products that it competes with".
   NOTE: no backticks inside these comments - they sit in a template literal.
   The peer block lives ONCE per subcategory on PAYLOAD.meta.peers, so a row
   looks its own up rather than carrying a copy. */
/* ⛔⛔ NO ADJECTIVES INSIDE THE TABLE (ruling: Jack, 2026-09-04): "dont put
   'cheaper' or other adj inline in the table when building - you can put that
   somewhere as a call out or something, but make the table quick to read and
   compare." A table is for scanning columns of like against like; a word wedged
   into a numeric cell breaks the alignment the eye is using. Every judgement now
   lives in peerNotes() BELOW the table. */
function num1(v,d){ return v==null||v==="" ? "&mdash;" : Number(v).toFixed(d==null?2:d); }
function pctCell(v){ return v==null ? "&mdash;" : `${v>0?"+":""}${Number(v).toFixed(0)}%`; }

function peerRows(list,cand,showSub){
  return list.map(p=>`<tr class="${p.active?"":"off"}">
      <td>${esc(p.brand||"")}${showSub?`<span class="mut small"> &middot; ${esc(p.subcategory||"")}</span>`:""}</td>
      <td>${esc(p.name||"")}</td>
      <td class="n">${p.active?"&#10003;":"&ndash;"}</td>
      <td class="n">${money(p.price)}</td>
      <td class="n">${p.cost==null?"&mdash;":money(p.cost)}</td>
      <td class="n">${p.margin==null?"&mdash;":Math.round(p.margin*100)+"%"}</td>
      <td class="n">${num1(p.units_wk_recent!=null?p.units_wk_recent:p.units_wk)}</td>
      <td class="n">${p.families==null?"&mdash;":p.families}</td>
      <td class="n">${p.top_1_share==null?"&mdash;":Math.round(p.top_1_share)+"%"}</td>
      <td class="n">${acvPct(p.nc_acv)}</td>
      <td class="n">${num1(p.spins_expected_units_wk)}</td>
      <td class="n">${p.vs_market==null?"&mdash;":p.vs_market.toFixed(2)+"\u00d7"}</td>
      <td class="n">${pctCell(p.trend_pct)}</td>
      <td class="n">${pctCell(p.spins_growth_pct)}</td></tr>`).join("");
}

/* ⭐ THE CALL-OUT. Everything the table deliberately does not say, in sentences,
   and only where it is worth saying. ⛔ 0.8-1.25x reads as parity: our units/wk
   and SPINS' projection are two different measurements, so the page must never
   call 0.9 "underperforming". */
function peerNotes(list,cand){
  const out=[], live=list.filter(p=>p.active);
  const cheaper=live.filter(p=>cand&&p.price&&p.price<cand);
  if(cheaper.length) out.push(`${cheaper.length===1?"One item we already sell is":`${cheaper.length} items we already sell are`} cheaper than ours would be: ${
    cheaper.slice(0,3).map(p=>`${esc(p.brand)} at ${money(p.price)}`).join(", ")}.`);
  const under=live.filter(p=>p.vs_market!=null&&p.vs_market<0.8);
  const over=live.filter(p=>p.vs_market!=null&&p.vs_market>1.25);
  if(under.length) out.push(`Selling below what the market expects here: ${
    under.slice(0,3).map(p=>`${esc(p.brand)} (${p.vs_market.toFixed(2)}\u00d7)`).join(", ")}.`);
  if(over.length) out.push(`Beating the market here: ${
    over.slice(0,3).map(p=>`${esc(p.brand)} (${p.vs_market.toFixed(2)}\u00d7)`).join(", ")}.`);
  /* ⭐⭐ THE POINT JACK MADE (2026-09-04): a weekly household count reads as
     breadth and is not. Oatly Barista shows ~1.5 households a week and is really
     one family ordering fortnightly - 44% of its demand. An item whose base is
     one household will not expand just because we put a second one beside it.
     ⛔ "High" is measured against OUR catalogue, never a made-up threshold. */
  const bm=(PAYLOAD&&PAYLOAD.meta&&PAYLOAD.meta.concentration_benchmarks)||null;
  const hi=bm&&bm.top_1_share?bm.top_1_share.p75:null;
  const conc=live.filter(p=>p.top_1_share!=null&&hi!=null&&p.top_1_share>=hi);
  if(conc.length) out.push(`Demand here leans on a few households: ${
    conc.slice(0,3).map(p=>`${esc(p.brand)} (${Math.round(p.top_1_share)}% of its units go to one family${
      p.top_1_orders?`, across ${p.top_1_orders} orders`:""})`).join(", ")}. Above the ${
      hi}% top-buyer share of our upper quartile, so adding beside ${conc.length>1?"them":"it"} is unlikely to reach new households on its own.`);
  const thin=list.filter(p=>p.trend_note);
  if(thin.length===list.length&&list.length) out.push(`No item here has enough history for a 13-week trend.`);
  const dead=list.filter(p=>!p.active);
  if(dead.length) out.push(`${dead.length} listing${dead.length>1?"s are":" is"} switched off (&ndash; in the live column), so ${dead.length>1?"they have":"it has"} no market comparison.`);
  return out.length?`<p class="pnote">${out.join(" ")}</p>`:"";
}

/* ⭐ THE PROPOSED ITEM, IN THE SAME TABLE AND THE SAME COLUMNS (ruling: Jack,
   2026-09-04: "a way to see the proposed item next to this graph so that it shows
   the estimated amounts and the detail about SPINS 13 weeks for this item and how
   we estimate it will be performing in comparison to the existing ones").
   ⛔ THE HONEST COLUMN MAPPING MATTERS: a new item has NO history here, so
   "u/wk", "Families", "Top buyer", "vs mkt" and "Ours 13wk" are all dashes. Its
   number goes in "Mkt u/wk", because a projection is what the MARKET says it
   would do - putting an estimate in the "we sell" column would compare it against
   measured sales and quietly flatter it. */
function candRow(r){
  const mg=num(r.margin_regular);
  return `<tr class="me">
    <td><b>${esc(r.brand||"")}</b></td>
    <td><b>${esc(r.description||"")}</b> <span class="mut small">proposed</span></td>
    <td class="n"><span class="mut small">new</span></td>
    <td class="n"><b>${money(r.price)}</b></td>
    <td class="n">${r.regular_cost==null?"&mdash;":money(r.regular_cost)}</td>
    <td class="n">${mg==null?"&mdash;":Math.round(mg*100)+"%"}</td>
    <td class="n"><b>~${num1(r.proj_units_wk_calibrated)}</b><br><span class="mut small">est</span></td>
    <td class="n">&mdash;<br><span class="mut small">no history</span></td>
    <td class="n">&mdash;<br><span class="mut small">no history</span></td>
    <td class="n">${acvPct(r.nc_acv)}</td>
    <td class="n">${num1(r.proj_units_wk_calibrated)}</td>
    <td class="n">&mdash;</td>
    <td class="n">&mdash;</td>
    <td class="n">${pctCell(r.nc_growth_pct)}</td></tr>`;
}

/* ⛔ THE TABLE ALWAYS RENDERS, EVEN WITH NOTHING TO COMPARE AGAINST (ruling:
   Jack, 2026-09-04: "even if we dont have comparison items can get the SPINS and
   estimated data in the same format?"). A reviewer working 50 rows should find the
   proposed item's numbers in the SAME PLACE every time. Losing the whole table
   when SPINS has not mapped the subcategory made the layout jump and hid the
   candidate's own SPINS figures. */
const PEER_HEAD = `<tr><th>Brand</th><th>What we list</th><th class="n">Live</th><th class="n">Price</th><th class="n">Cost</th><th class="n">Margin</th><th class="n">u/wk</th><th class="n">Families</th><th class="n">Top buyer</th><th class="n">%ACV</th><th class="n">Mkt u/wk</th><th class="n">vs mkt</th><th class="n">Ours 13wk</th><th class="n">SPINS YoY</th></tr>`;

function candOnly(r, why){
  return `<p class="pnote">${why}</p>`
    + `<div class="pwrap"><table class="ptab">${PEER_HEAD}${candRow(r)}</table></div>`
    + `<p class="pnote">The highlighted row is the proposed item. Its <b>u/wk is an ESTIMATE</b> (the market projection). <b>Families</b>, <b>Top buyer</b>, <b>vs mkt</b> and <b>Ours 13wk</b> are blank because it has no sales history with us yet.</p>`;
}

function peerBlock(r){
  const P=(PAYLOAD&&PAYLOAD.meta&&PAYLOAD.meta.peers)||null;
  if(!P) return candOnly(r, `No peer table in this payload${
    PAYLOAD&&PAYLOAD.meta&&PAYLOAD.meta.peers_note?" ("+esc(PAYLOAD.meta.peers_note)+")":""}, so there is nothing to compare against &mdash; the proposed item's own figures are below.`);
  const b=P[r.subcategory];
  if(!b) return candOnly(r, `SPINS has not mapped <b>${esc(r.subcategory||"this subcategory")}</b> to our catalogue, so we cannot say what we already sell in it. That is a gap in the mapping, <b>not</b> evidence that we sell nothing &mdash; the proposed item's own figures are below.`);
  const st=b.stats||{}, cand=r.price;
  const head=PEER_HEAD;
  let out=`<p class="pnote">We list <b>${st.n_listed}</b> item(s) in <b>${esc(b.subcategory)}</b> &middot; ${st.n_active} active &middot; ${st.n_selling} sold anything in 12 weeks &middot; together <b>${fmt(st.units_wk_total,2)}</b> u/wk${
    st.price_min!=null?` &middot; priced ${money(st.price_min)}&ndash;${money(st.price_max)}`:""}.</p>`;
  if(b.same&&b.same.length){
    out+=`<div class="pwrap"><table class="ptab">${head}${candRow(r)}${peerRows(b.same,cand,false)}</table></div>`+peerNotes(b.same,cand);
    if(b.same_truncated) out+=`<p class="pnote">+ ${b.same_truncated} more not shown.</p>`;
  } else {
    out+=`<div class="pwrap"><table class="ptab">${head}${candRow(r)}</table></div>`
      +`<p class="pnote">We list nothing else in this subcategory today &mdash; this would be the first.</p>`;
  }
  if(b.related&&b.related.length){
    out+=`<p class="pnote" style="margin-top:9px"><b>Related shelves</b> &mdash; the same product in a different storage class. Kept separate on purpose: it is a different shelf decision, but it competes for the same customer.</p>
      <div class="pwrap"><table class="ptab">${head}${peerRows(b.related,cand,true)}</table></div>`+peerNotes(b.related,cand);
  }
  const acv=num(r.nc_acv);
  if(acv!=null&&acv<20) out+=`<p class="pnote">⚠️ <b>Only ${acvPct(acv)} of North Central stores carry this</b>${
    acv<5?" — barely distributed":""}. Across the 3,461 scored candidates the median is 8% and the top 60 sit at 18%, so its projection rests on a narrow base of stores.</p>`;
  out+=`<p class="pnote"><b>Ours 13wk</b> is our own last 13 weeks against the 13 before it. <b>SPINS YoY</b> is the latest 13-week market period against the same period a year ago &mdash; different bases, so read them side by side, not as one trend.</p>`;
  out+=`<p class="pnote">The highlighted row is the proposed item. Its <b>u/wk is an ESTIMATE</b> (the market projection) &mdash; every other row on that column is what we have actually sold. <b>Families</b>, <b>Top buyer</b>, <b>vs mkt</b> and <b>Ours 13wk</b> are blank for it because it has no sales history with us yet, not because the data is missing.</p>`;
  if(cand) out+=`<p class="pnote">Ours would be <b>${money(cand)}</b>. &#9888; This table is for judgement, not for pricing &mdash; it is size-blind, so never read the median as a price to match.</p>`;
  /* ⭐ WHAT AN ADD HAS HISTORICALLY DONE HERE. A BAND with its n, never a per-item
     number - the per-item transfer ratio was measured and rejected as unstable. */
  const im=b.expected_impact;
  if(im) out+=`<p class="pnote"><b>What adding tends to do:</b> on ${im.n_events} past adds onto a shelf this busy, the items already there moved <b>${im.median_incumbent_change_pct>0?"+":""}${im.median_incumbent_change_pct}%</b> against the store trend, and ${im.share_negative_pct}% of them fell.${
    im.shelf_households_change_pct!=null?` Across all ${im.shelf_n_events} adds the incumbents lost households but the shelf as a whole moved ${im.shelf_households_change_pct>0?"+":""}${im.shelf_households_change_pct}% &mdash; the median add <b>redistributes reach rather than growing it</b>, so "it will grow the category" is not on its own a reason to add. Filling a gap nothing else covers is.`:""}</p>`;
  if(r.brand_skus_we_list) out+=`<p class="pnote">We already list <b>${r.brand_skus_we_list}</b> SKU(s) from <b>${esc(r.brand||"")}</b>.</p>`;
  out+=`<p class="pnote">Source: ${esc(b.source||"")}</p>`;
  return out;
}

function whyNotLine(r){
  const w=r.spins_why_not;
  if(!w||!w.length) return "";
  const tier={"P1-VALUE-TIER":"cheaper than anything we stock","P2-CATEGORY-GAP":"a category we stock nothing in",
    "P3-VELOCITY-UPGRADE":"faster than our best seller here","P4-LOCAL-GEM":"a local brand"};
  const bits=[];
  for(const g of w){
    const failed=(g.failed||[]).filter(f=>f && f.pass===false).slice(0,2);
    if(!failed.length) continue;
    const why=failed.map(f=>{
      const have=(f.have===true?"yes":f.have===false?"no":f.have);
      return `${f.gate} ${have}, needs ${f.need}`;
    }).join("; ");
    bits.push(`<b>${tier[g.gate]||g.gate}</b> — ${why}`);
  }
  if(!bits.length) return "";
  return `SPINS does not list this as an add. It is looking for one of four things and this is `
    + `none of them: ${bits.join(" · ")}. <span class="mut">That is about assortment gaps, `
    + `not about whether it is worth buying.</span>`;
}

/* ── render ───────────────────────────────────────────────────────────── */
function factorChips(r){
  const c=[];
  if(r.on_promo) c.push('<span class="chip good">ON PROMO</span>');
  if(r.carried_state==="lapsed") c.push('<span class="chip warnc">BRING-BACK — we carried this before</span>');
  if(r.storage==="R") c.push('<span class="chip warnc">REFRIGERATED — tightest space</span>');
  if(r.storage==="F") c.push('<span class="chip">frozen</span>');
  if((r.our_units_wk_subcat||0)===0) c.push('<span class="chip good">fills a gap we don\'t serve</span>');
  if(r.demoted) c.push('<span class="chip bad">DEMOTED on the real price</span>');
  if(String(r.regular_cost_basis||"").includes("DERIVED"))
    c.push('<span class="chip warnc">cost derived, not quoted</span>');
  {const oi=orderInc(r);
   if(!oi.known) c.push('<span class="chip warnc">order increment unknown</span>');
   else if(oi.inc>1) c.push(`<span class="chip">orders in ${oi.inc}s</span>`);}
  if(r.subcat_pick_number>1)
    c.push(`<span class="chip">#${r.subcat_pick_number} this week in ${esc(r.subcategory||"")}</span>`);
  return c.join("");
}
function rowHtml(r){

  const qty=d.approved_qty??r.proposed_qty??"";
  const why=(r.why||[]).map(w=>`<li>${esc(w)}</li>`).join("");
  const qwhy=(r.proposed_qty_why||[]).map(w=>`<li>${esc(w)}</li>`).join("");
  const wn=(r.spins_why_not||[]).map(w=>`<li>${esc(typeof w==="string"?w:JSON.stringify(w))}</li>`).join("");
  const imgs=(r.rivir&&r.rivir.images||[]).map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join("");
  const certs=(r.rivir&&r.rivir.certifications||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  return `<div class="row ${r.demoted?"demoted":""}" data-upc="${esc(r.upc)}">
   <div class="head" onclick="if(!event.target.closest('.rowacts'))this.parentNode.classList.toggle('open')">
     ${img}
     <div class="idcol"><div class="title">${esc(r.description||"(no description)")}</div>
       <div class="brand">${esc(r.brand||"")} · ${esc(r.subcategory||"")}</div>
       <div class="chips">${factorChips(r)}</div></div>
     <div class="nums"><div class="big">${money(r.price)}</div>
       <div class="sub">${fmt(r.proj_units_wk_calibrated,1)} u/wk${
         r.margin_regular!=null?` · ${Math.round(r.margin_regular*100)}% margin`:""}</div>
       <!-- DISTRIBUTION ON THE COLLAPSED ROW (Jack, 2026-09-04). The list is the
            working surface - approve, decline and quantity are all here - so the
            fact that most decides whether a projection is trustworthy has to be
            here too. Under 20 percent of the region is amber, under 5 is red, and
            the bands are the measured percentiles of this very list. -->
       <div class="sub acv ${acvCls(r)}">${acvText(r)}</div></div>
     <!-- ⭐ DECIDE WITHOUT EXPANDING (Jack, 2026-09-04). The spec always said three
          taps at card level; the first build buried them in the detail pane, so
          working the list meant opening every row. The rowacts wrapper stops the
          click from toggling the row so a mis-tap never collapses what you are
          editing. NOTE: no backticks in here - this comment sits INSIDE a template
          literal, and a stray backtick terminates it and breaks the whole file. -->
     <div class="rowacts" onclick="event.stopPropagation()">
       <input type="number" min="${oi.inc}" step="${oi.inc}" inputmode="numeric"
              aria-label="quantity, orderable in ${oi.inc}s"

       ${["approve","decline"].map(x=>

       <button class="mini ${d.decision==="question"?"on":""}" data-d="question" data-u="${esc(r.upc)}"

     </div>
   </div>
   <div class="body">

     <!-- ⭐ THE SHELF, FIRST (Jack, 2026-09-05): where this item sits against what

     <details class="raw mapslot" open data-upc="${esc(r.upc)}"

function tally(){

  document.getElementById("tally").textContent =

/* ── interaction ──────────────────────────────────────────────────────── */
/* ⛔⛔ CAPTURE EDITS AS THEY HAPPEN. Reading the quantity and the note only at
   button-click meant "click approve, then change the quantity" submitted the OLD
   number — real money — and "click question, then type the question" submitted an
   empty question. Re-rendering (a tab switch) also discarded whatever was typed.
   Found by an independent review, 2026-09-04. */
/* ⭐ snap to a real orderable quantity when the field loses focus — typing is not
   fought mid-keystroke, but nothing invalid survives. Rounds UP: a short order is
   worse than one extra minimum. */
document.addEventListener("change",e=>{
  const q=e.target.closest("input[data-q]"); if(!q) return;
  const inc=parseInt(q.dataset.inc||"1",10)||1;
  const was=Number(q.value), now=snapQty(was,inc);
  if(now!==was){
    q.value=now;
    const s=document.getElementById("status");
    if(s) s.textContent=`${was} is not orderable — rounded up to ${now} (multiples of ${inc}).`;
  }
  const u=q.dataset.q, cur=DECIDED[u];
  if(cur){ cur.approved_qty=now; cur._dirty=true; tally(); }
  document.querySelectorAll(`input[data-q="${CSS.escape(u)}"]`).forEach(x=>x.value=now);
});
document.addEventListener("input",e=>{
  const q=e.target.closest("input[data-q]"), n=e.target.closest("textarea[data-n]");
  const u=(q&&q.dataset.q)||(n&&n.dataset.n); if(!u) return;
  const cur=DECIDED[u]; if(!cur) return;          /* nothing decided yet — nothing to update */
  if(q) cur.approved_qty = q.value===""?null:Number(q.value);
  if(n) cur.reviewer_note = n.value;
  cur._dirty=true; tally();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
        TAB=t.dataset.tab; render(); return;}
  const b=e.target.closest("button[data-d]");
  if(b){
    e.stopPropagation();
    const u=b.dataset.u, row=ROWS.find(r=>r.upc===u);
    const cur=DECIDED[u]||{};
    const qEl=document.querySelector(`input[data-q="${CSS.escape(u)}"]`);
    const nEl=document.querySelector(`textarea[data-n="${CSS.escape(u)}"]`);
    DECIDED[u]={...cur,decision:b.dataset.d,
      approved_qty:qEl&&qEl.value!==""?Number(qEl.value):row.proposed_qty,
      reviewer_note:nEl?nEl.value:"",_dirty:true,_row:row};
    // ⭐ the same decision now exists in two places on one row (the collapsed
    // controls and the detail pane) — repaint BOTH, or the row can show
    // "approved" in one and nothing in the other.
    const rowEl=b.closest(".row");
    rowEl.querySelectorAll("button[data-d]").forEach(x=>{
      const on = x.dataset.d===b.dataset.d;
      x.classList.toggle("on",on); x.setAttribute("aria-pressed",on);
    });
    rowEl.classList.add("decided");
    tally();
  }
});

function scales(rows,W,H){

  if(x1<=x0)x1=x0+1; if(y1<=y0)y1=y0+1;
  const lg=n=>Math.log10(Math.max(n,0.05));
  const X=n=>{const a=view.x.log?lg(n):n,A=view.x.log?lg(x0):x0,B=view.x.log?lg(x1):x1;
              return P.l+(a-A)/(B-A)*(W-P.l-P.r);};
  const Y=n=>{const c=Math.max(y0,Math.min(y1,n));
              return H-P.b-((c-y0)/(y1-y0))*(H-P.t-P.b);};
  const clipped=ys.filter(n=>n<y0||n>y1).length;
  return {X,Y,x0,x1,y0,y1,P,clipped};
}

/* ── draw ── */
const cv=$('cv'), ctx=cv.getContext('2d');
const hl=$('hl'), hctx=hl.getContext('2d');

/* ⭐⭐ THE HOVER RING — with thousands of overlapping dots you cannot tell which
   one the tooltip is describing. A ring drawn around the exact point removes the
   guess. ⛔ Two strokes, light-on-dark, so it reads on top of a dense cluster of
   ANY colour; a single thin ring vanishes into the pile. */
function ring(p){
  const W=cv.clientWidth,H=cv.clientHeight;
  // ⛔ the overlay must share the main canvas's geometry EXACTLY, or the ring is
  // drawn at a scaled position. Re-assert it here rather than trusting CSS.
  if(hl.clientWidth!==W||hl.clientHeight!==H){
    hl.style.width=W+'px'; hl.style.height=H+'px';
    const dpr=window.devicePixelRatio||1;
    hl.width=W*dpr; hl.height=H*dpr; hctx.setTransform(dpr,0,0,dpr,0,0);
  }
  hctx.clearRect(0,0,W,H);
  if(!p) return;
  const r=Math.max(8,p.r+5);
  hctx.beginPath(); hctx.arc(p.x,p.y,r,0,6.2832);
  hctx.strokeStyle=css('--surface-1').trim(); hctx.lineWidth=4.5; hctx.stroke();
  hctx.beginPath(); hctx.arc(p.x,p.y,r,0,6.2832);
  hctx.strokeStyle=css('--ink').trim(); hctx.lineWidth=2; hctx.stroke();
  // a short leader toward the tooltip side keeps the eye on the right dot
  hctx.beginPath(); hctx.arc(p.x,p.y,1.6,0,6.2832);
  hctx.fillStyle=css('--ink').trim(); hctx.fill();
}
function draw(){
  const rows=visible(), host=$('plot');
  const W=host.clientWidth, H=Math.max(360,Math.min(560,Math.round(W*0.56)));
  /* ⛔⛔ A ZERO-WIDTH CONTAINER DRAWS NOTHING AND LOOKS LIKE A BUG. An embedded
     map can be built while its product row is still collapsed — the element is in
     the DOM but has no width — so the scatter came out blank and NOTHING redrew
     it once the row opened (2026-09-05). ⭐ Bail out; the ResizeObserver at the
     bottom calls back the moment the container has a real size. */
  if(W < 40) return;
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  hl.width=W*dpr; hl.height=H*dpr; hl.style.height=H+'px';
  hctx.setTransform(dpr,0,0,dpr,0,0); hctx.clearRect(0,0,W,H);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(!rows.length){pts=[];$('note').textContent='No items match these filters.';return;}
  const S=scales(rows,W,H); const {X,Y,P}=S;
  const line=css('--line').trim(), ink3=css('--ink-3').trim();

  /* grid + zero line */
  ctx.strokeStyle=line; ctx.lineWidth=1; ctx.font='11px -apple-system,sans-serif';
  ctx.fillStyle=ink3; ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const yv=S.y0+(S.y1-S.y0)*i/4, y=Math.round(Y(yv))+.5;
    ctx.globalAlpha=.55; ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(W-P.r,y); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillText(Math.round(yv)+(view.y.unit==='%'?'%':''),P.l-7,y+3.5);
  }
  if(view.y.zero){const y=Math.round(Y(0))+.5; ctx.strokeStyle=ink3; ctx.globalAlpha=.55;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.globalAlpha=1;}
  if(view.vline!=null && view.vline>S.x0){const x=Math.round(X(view.vline))+.5;
    ctx.strokeStyle=ink3;ctx.globalAlpha=.5;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,H-P.b);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;}
  /* x ticks */
  ctx.textAlign='center';
  const xt=view.x.log?[1,5,10,25,50,100].filter(n=>n>=S.x0&&n<=S.x1)
    :Array.from({length:5},(_,i)=>S.x0+(S.x1-S.x0)*i/4);
  let lastX=-1e9;
  xt.forEach(n=>{const x=X(n); if(x-lastX<38) return; lastX=x;      // ⛔ no collisions
    ctx.fillText((view.x.unit==='$'?'$':'')+(n<10?(+n).toFixed(1):Math.round(n))+
      (view.x.unit==='%'?'%':view.x.unit==='w'?'w':''),x,H-P.b+15);});

  /* marks — market first so ours/candidates sit on top */
  pts=[];
  const order={market:0,ours:1,candidate:2};
  const sorted=[...rows].sort((a,b)=>order[a.pop]-order[b.pop]);
  const selIdx=new Map(sel.map((s,i)=>[s.upc,i]));
  for(const r of sorted){
    const x=X(+r[view.x.k]), y=Y(+r[view.y.k]);
    if(x<P.l-6||x>W||y<0||y>H) continue;
    const isSel=selIdx.has(r.upc);
    const mag=r.dollars? Math.min(7,2.2+Math.log10(Math.max(r.dollars,1))*0.62):2.6;
    const rad=isSel?Math.max(6,mag+2):(r.pop==='market'?Math.max(1.6,mag*0.62):mag);
    const col=isSel?SELC[selIdx.get(r.upc)%SELC.length]:css(POPC[r.pop]).trim();
    ctx.globalAlpha=isSel?1:(r.pop==='market'?0.42:0.85);
    // ⭐ a SELECTED mark takes its population's shape, so the map and the trend
    // panels below it speak the same visual language. Unselected marks stay
    // circles — at 2px a square and a circle are the same smudge.
    if(isSel && r.pop==='market'){
      const w=rad*1.8; ctx.fillStyle=col;
      ctx.fillRect(x-w/2,y-w/2,w,w);
      ctx.lineWidth=2;ctx.strokeStyle=css('--surface-1').trim();ctx.strokeRect(x-w/2,y-w/2,w,w);
    } else if(isSel && r.pop==='candidate'){
      ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832);
      ctx.fillStyle=css('--surface-1').trim(); ctx.fill();
      ctx.lineWidth=2.5; ctx.strokeStyle=col; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fillStyle=col; ctx.fill();
      if(isSel){ctx.lineWidth=2;ctx.strokeStyle=css('--surface-1').trim();ctx.stroke();}
    }
    /* ⭐⭐ SEASONAL LIFT MARKER. An item about to enter its season is a different
       buy from the same item just past it, and that was invisible on the map.
       ⛔ Drawn ONLY for ours/candidates — putting a chevron on 16k market dots
       would turn the signal into texture. ⛔ And only where SPINS actually says
       peak/trough ahead, never inferred from the growth number. */
    const sf=r.seasonFlag==null?null:(VOC.seasonFlag||[])[r.seasonFlag];
    if(r.pop!=='market' && (sf==='SEASON-PEAK-AHEAD'||sf==='SEASON-TROUGH-AHEAD')){
      const up=sf==='SEASON-PEAK-AHEAD', h=Math.max(4,rad*0.95), yb=y-rad-2.5;
      ctx.globalAlpha=isSel?1:0.92;
      ctx.beginPath();
      if(up){ ctx.moveTo(x,yb-h); ctx.lineTo(x-h*0.72,yb); ctx.lineTo(x+h*0.72,yb); }
      else  { const yt=y+rad+2.5;
              ctx.moveTo(x,yt+h); ctx.lineTo(x-h*0.72,yt); ctx.lineTo(x+h*0.72,yt); }
      ctx.closePath();
      ctx.fillStyle=up?css('--good').trim():css('--bad').trim();
      ctx.strokeStyle=css('--surface-1').trim(); ctx.lineWidth=1.4;
      ctx.stroke(); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=1;
    pts.push({x,y,r:Math.max(rad,4),d:r});
  }
  // ⭐ NAME THE QUADRANTS. Without them a scatter is a cloud — the label is what
  // turns a position into a decision ("arriving" vs "being delisted").
  if(view.quads){
    ctx.font='600 10px -apple-system,sans-serif'; ctx.fillStyle=ink3;
    const half=(W-P.l-P.r)/2-14;
    // ⭐ each caption must fit its own half, or the left and right run together
    // into a smear (seen at 642px). Shorten, then drop — never overlap.
    const fits=t=>ctx.measureText(t.toUpperCase()).width<=half;
    const short=t=>t.split(/\s+[—-]\s+/)[0];
    let labs=view.quads;
    if(!labs.every(fits)) labs=view.quads.map(short);
    if(labs.every(fits)){
      ctx.globalAlpha=.85;
      const put=(t,x,y,al)=>{ctx.textAlign=al;ctx.fillText(t.toUpperCase(),x,y);};
      put(labs[0],P.l+8,P.t+11,'left');   put(labs[1],W-P.r-8,P.t+11,'right');
      put(labs[2],P.l+8,H-P.b-8,'left');  put(labs[3],W-P.r-8,H-P.b-8,'right');
      ctx.globalAlpha=1;
    }
    ctx.textAlign='center';
  }
  let nSeason=0,nTrough=0;
  for(const r of rows){ if(r.pop==='market') continue;
    const sf=r.seasonFlag==null?null:(VOC.seasonFlag||[])[r.seasonFlag];
    if(sf==='SEASON-PEAK-AHEAD') nSeason++; else if(sf==='SEASON-TROUGH-AHEAD') nTrough++; }
  $('axl').textContent=view.x.label+'  →';
  $('note').innerHTML=
    '<b>'+rows.length.toLocaleString()+'</b> items shown'+
    (nSeason?' · <span style="color:var(--good)">▲</span> <b>'+nSeason+
      '</b> heading INTO their season'+(nTrough?', <span style="color:var(--bad)">▼</span> '+
      nTrough+' just past it':'')+' (SPINS)':'')+
    (fReco?' · <b style="color:var(--cand)">showing only the '+RECO_N+
      ' recommended candidates</b> (the same ones on the Recommended tab), with our '+
      'items and the market kept as context':'')+' · '+esc(view.blurb)+
    (S.clipped?' <b>'+S.clipped+'</b> extreme value(s) sit pinned to the top or bottom edge '+
      'so the rest stays readable.':'')+
    ' <span class="mut">Market period ending '+esc(D.meta.period)+
    '. The market cloud is the top '+D.meta.market_top_n+
    ' sellers per shelf we compete on, not all of grocery.</span>';
}

/* ── hover ── */
function nearest(mx,my){
  let best=null,bd=1e9;
  for(const p of pts){const d=(p.x-mx)**2+(p.y-my)**2;
    if(d<bd && d<Math.max(90,p.r*p.r*4)){bd=d;best=p;}}
  return best;
}
/* ⭐ TAGS — the standing facts about an item, in the tooltip, so the decision to
   click is informed. ⛔ Only tags that are TRUE and KNOWN appear; an absent tag
   never means "no", it means we did not have the field. */
function tags(r){
  const t=[];
  if(r.pop==='candidate'&&recoSet().has(r.upc))
    t.push(['⭐ Recommended','var(--cand)',1]);
  if(r.pop==='ours')       t.push(['we sell this','var(--ours)',1]);
  if(r.onPromo)            t.push(['on promo','var(--good)',0]);
  if(r.lossLeader)         t.push(['loss leader','var(--good)',0]);
  const f=r.seasonFlag==null?null:(VOC.seasonFlag||[])[r.seasonFlag];
  if(f==='SEASON-PEAK-AHEAD')   t.push(['⬆ season ahead','var(--good)',0]);
  if(f==='SEASON-TROUGH-AHEAD') t.push(['⬇ off-season','var(--bad)',0]);
  if(f==='DECLINING')           t.push(['declining','var(--bad)',0]);
  if(f==='NEW-ITEM')            t.push(['new to market','var(--ink-2)',0]);
  const bp=attrVal(r,'brand_position');
  if(bp&&/CONVENTIONAL/i.test(bp)) t.push(['conventional','var(--bad)',0]);
  if(r.distTrend!=null&&(VOC.distTrend||[])[r.distTrend]==='BEING-DELISTED')
    t.push(['⛔ being delisted','var(--bad)',1]);
  if(r.cutList)   t.push(['⛔ on the cut list','var(--bad)',1]);
  if(r.priceFlag) t.push(['⚠ priced over market','var(--bad)',1]);
  if(r.subRank!=null&&r.subRank<=5) t.push(['#'+Math.round(r.subRank)+' on shelf','var(--ink-2)',0]);
  return t.sort((a,b)=>b[2]-a[2]).slice(0,5)
    .map(x=>'<span style="display:inline-block;border:1px solid currentColor;'+
      'border-radius:20px;padding:0 7px;margin:2px 3px 0 0;font-size:11px;'+
      'line-height:16px;color:'+x[1]+'">'+x[0]+'</span>').join('');
}
const tip=$('tip');
cv.addEventListener('mousemove',e=>{
  const b=cv.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  const p=nearest(mx,my); hot=p?p.d:null;
  ring(p);
  if(!p){tip.style.display='none';cv.style.cursor='crosshair';return;}
  const r=p.d; cv.style.cursor='pointer';
  const tg=tags(r);
  tip.innerHTML='<b>'+esc(r.desc||'(no description)')+'</b><br><span class="mut small">'+
    esc(v(r,'brand')||'')+' · '+esc(v(r,'sub')||'')+'</span>'+
    (tg?'<div style="margin:3px 0 1px">'+tg+'</div>':'<br>')+'<span class="small">'+
    (r.pop==='ours'?'<b style="color:var(--ours)">We sell this</b>':
     r.pop==='candidate'?'<b style="color:var(--cand)">Candidate this week</b>':'Market')+
    ' · '+view.x.label.split(',')[0]+': <b>'+fmt(r[view.x.k],view.x.unit)+'</b>'+
    ' · '+view.y.label.split(',')[0]+': <b>'+fmt(r[view.y.k],view.y.unit)+'</b></span>'+
    (priceLine(r)?'<br><span class="small">'+priceLine(r)+'</span>':'');
  tip.style.display='block';
  /* ⛔ THE TOOLTIP MUST NEVER COVER THE DOT IT DESCRIBES. Centred-and-above put it
     straight over the point, so you could not see which one you were about to
     click. ⭐ It now sits BESIDE the cursor and flips to whichever side has room,
     with a vertical fallback for the case where neither side fits. */
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const W=cv.clientWidth, H=cv.clientHeight, GAP=20, PAD=6;
  const fitsRight = mx+GAP+tw <= W-PAD, fitsLeft = mx-GAP-tw >= PAD;
  let left, top=Math.max(PAD,Math.min(my-th/2, H-th-PAD));
  if(fitsRight && (mx < W*0.55 || !fitsLeft))      left = mx+GAP;   // to the right
  else if(fitsLeft)                                left = mx-GAP-tw;// to the left
  else {
    // ⛔ neither side fits (a narrow plot): go above or below instead, and pick
    // whichever half of the plot the point is NOT in, so it still never overlaps.
    left = Math.max(PAD, Math.min(mx-tw/2, W-tw-PAD));
    top  = (my > H/2) ? Math.max(PAD, my-GAP-th) : Math.min(H-th-PAD, my+GAP);
  }
  tip.style.left=Math.round(left)+'px';
  tip.style.top=Math.round(top)+'px';
});
cv.addEventListener('mouseleave',()=>{tip.style.display='none';hot=null;ring(null);});
/* ⭐ RETAIL AND MARGIN, the two numbers a buying decision actually turns on.
   ⛔ A candidate's price is our ESTIMATE (cost ÷ the category's learned margin),
   NOT a price anyone has agreed — it is labelled "est." so nobody reads it as set.
   ⛔ Margin is shown ONLY where a real cost exists; 29% of our own SKUs have none
   and a blank is safer than a margin computed against a guessed cost. */
function priceBits(r){
  const isC=r.pop==='candidate';
  const price=isC?r.price:(r.ourSale!=null?r.ourSale:r.ourPrice);
  const cost =isC?r.cost:r.ourCost;
  const marg =isC?r.margin:r.ourMargin;
  const m = marg==null ? (price&&cost?((price-cost)/price):null) : marg;
  return {price, cost, m, isC,
          label:isC?'est. retail':(r.ourSale!=null?'our price (on sale)':'our price')};
}
function priceLine(r){
  const b=priceBits(r);
  if(b.price==null && b.cost==null) return '';
  const mg=b.m==null?null:Math.round(b.m*100);
  return '<span class="k">'+(b.price==null?'—':money(b.price))+'</span>'+
    ' <span class="mut">'+b.label+'</span>'+
    (mg==null?' <span class="mut">· margin unknown</span>'
             :' · <span class="k" style="color:'+(mg<25?'var(--bad)':mg>=35?'var(--good)':'inherit')+
              '">'+mg+'% margin</span>')+
    (b.cost==null?'':' <span class="mut">at '+money(b.cost)+' cost</span>');
}
function fmt(n,u){return n==null?'—':u==='%'?pct(n):u==='$'?money(n):u==='w'?Math.round(n)+'w':(+n).toFixed(1);}

/* ── selection ── */
cv.addEventListener('click',e=>{
  const b=cv.getBoundingClientRect();
  const p=nearest(e.clientX-b.left,e.clientY-b.top); if(!p) return;
  const i=sel.findIndex(s=>s.upc===p.d.upc);
  if(i>=0) sel.splice(i,1);
  else {
    /* ⛔⛔ NEVER EVICT THE FOCUSED ITEM. `sel.shift()` drops slot 0, which in an
       embedded section is the very product the section is about — so adding a
       few comparisons made it vanish from its own chart, silently. ⭐ Drop the
       oldest NON-focus selection instead. */
    if(sel.length>=6){
      const j=sel.findIndex(x=>!focusUpc || x.upc!==focusUpc);
      sel.splice(j<0?0:j,1);
    }
    sel.push(p.d);
  }
  draw(); renderSel();
});
$('clear').onclick=()=>{sel=[];draw();renderSel();};

/* ── the trend chart: real series, one line per selected item ── */
let trendMode=null;          // null = choose automatically

/* ⭐⭐ SMALL MULTIPLES, NOT ONE CHART WITH SEVERAL SCALES.
   ⛔ Market DOLLARS conflate two different things: how many stores carry it, and
   how much each store sells. An item's dollars can climb while every store sells
   LESS of it — distribution outrunning demand, which is what a delist looks like
   on the way down. So each measure gets its own panel and its own y-scale, and
   ⛔ never a second axis on one chart. Colour ties a line to its item across all
   panels, so the eye reads one product down the stack. */
/* ⭐ SHAPE CARRIES THE POPULATION, colour carries the item. ⛔ Colour alone fails
   for a colour-blind reader and in print; the pair is redundant on purpose.
     ours      ● filled circle  — a real, measured thing
     candidate ○ open circle    — hollow because it is not ours yet
     market    ■ square         — a different kind of object entirely       */
function marker(pop,x,y,c,big){
  const r=big?4.6:3.2;
  if(pop==='candidate')
    return `<circle cx="${x}" cy="${y}" r="${r+1}" fill="var(--surface-1)" `+
           `stroke="${c}" stroke-width="2"/>`;
  if(pop==='market'){const w=r*1.8;
    return `<rect x="${(x-w/2).toFixed(1)}" y="${(y-w/2).toFixed(1)}" `+
           `width="${w.toFixed(1)}" height="${w.toFixed(1)}" fill="${c}"/>`;}
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
}
function shapeKey(){
  const seen=[...new Set(sel.map(s=>s.pop))];
  const nm={ours:'we sell it',candidate:'candidate',market:'market'};
  return '<div class="small mut" style="display:flex;gap:11px;margin:2px 0 0;flex-wrap:wrap">'+
    seen.map(p=>'<span>'+(p==='ours'?'●':p==='candidate'?'○':'■')+' '+nm[p]+'</span>').join('')+
    (focusUpc?'<span><b>—</b> thick line = this item</span>':'')+
    '</div>';
}
function mini(title, get, labels, opt){
  opt=opt||{};
  const W=300,H=opt.h||86,P={l:34,r:8,t:8,b:15};
  const ser=sel.map(get);
  const all=ser.flat().filter(x=>x!=null);
  if(all.length<2) return '';
  let lo=Math.min(...all), hi=Math.max(...all);
  if(opt.zero) lo=Math.min(0,lo);
  if(hi<=lo) hi=lo+1;
  const n=Math.max(...ser.map(a=>a.length));
  const X=i=>n<2?P.l:P.l+i/(n-1)*(W-P.l-P.r);
  const Y=d=>H-P.b-((d-lo)/(hi-lo))*(H-P.t-P.b);
  const f=opt.fmt||(v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'k':
                      (v>=10?Math.round(v):(+v).toFixed(1)));
  let g='';
  [hi,lo].forEach(vv=>{const y=Y(vv).toFixed(1);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${P.l-5}" y="${+y+3.5}" text-anchor="end" fill="var(--ink-3)" font-size="9">`+f(vv)+'</text>';});
  ser.forEach((a,k)=>{
    const pp=a.map((d,i)=>d==null?null:[X(i),Y(d)]).filter(Boolean);
    if(!pp.length) return;
    const c=SELC[k%SELC.length];
    const dash=opt.projected&&opt.projected(sel[k]);
    const isFocus = focusUpc && sel[k] && sel[k].upc===focusUpc;
    if(pp.length>1)
      g+=`<path d="M${pp.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" `+
         `stroke="${c}" stroke-width="${isFocus?3.6:1.9}" stroke-linejoin="round" `+
         `stroke-linecap="round"`+
         (dash?' stroke-dasharray="5 4"':'')+`/>`;
    const pop=sel[k]?sel[k].pop:'ours';
    if(n<=5) pp.forEach(q=>{g+=marker(pop,q[0].toFixed(1),q[1].toFixed(1),c,isFocus);});
    else { const q=pp[pp.length-1]; g+=marker(pop,q[0].toFixed(1),q[1].toFixed(1),c,true); }
  });
  const L=(labels||[]).filter(x=>x!=null&&x!=='');
  L.forEach((t,i)=>{
    const lx=L.length<2?P.l:P.l+i/(L.length-1)*(W-P.l-P.r);
    g+=`<text x="${lx.toFixed(1)}" y="${H-3}" fill="var(--ink-3)" font-size="9" `+
       `text-anchor="${i===0?'start':i===L.length-1?'end':'middle'}">${t}</text>`;});
  return '<div style="margin-top:12px"><div class="small mut" style="font-weight:600;'+
    'letter-spacing:.02em;margin-bottom:1px">'+title+'</div>'+
    `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">${g}</svg>`+
    (opt.note?'<div class="small mut" style="margin-top:-2px">'+opt.note+'</div>':'')+'</div>';
}

function trendSVG(){
  if(!sel.length) return '';
  const LAG=D.meta.lag_points||['yr ago','12w','4w','now'];
  /* panel 1 — market dollars, the 26-period series, with the index toggle */
  const raw=sel.map(s=>(s.series||[]));
  const peaks=raw.map(a=>Math.max(0,...a.filter(x=>x!=null)));
  const pos=peaks.filter(x=>x>0);
  const lo=pos.length?Math.min(...pos):0, hi=peaks.length?Math.max(...peaks):0;
  const spread=(lo>0&&hi/lo>8);
  const idx=trendMode==null?spread:trendMode==='index';
  const ser=idx?raw.map(a=>{const b=a.find(x=>x!=null&&x>0);
                 return a.map(x=>x==null||!b?null:x/b*100);}):raw;
  let out='<h2 style="margin-top:15px">How these are doing</h2>'+
    '<div class="seg" style="margin-bottom:2px"><button data-t="abs" aria-pressed="'+(!idx)+
    '">Dollars</button><button data-t="index" aria-pressed="'+idx+'">Indexed</button></div>'+
    mini('Market sales, 2 years', (s,i)=>ser[sel.indexOf(s)]||[],
         [PER[0],PER[PER.length-1]], {h:104, zero:!idx,
      note: idx?'Each line starts at 100 — shapes compare, ⛔ not sizes'+
                (trendMode==null&&lo>0?' · auto: '+Math.round(hi/lo)+'-fold apart':'')
               :'Total dollars, North Central, per 4-week period'});
  /* ⭐ the two panels that separate "more shelves" from "more demand" */
  out+=shapeKey();
  out+=mini('Distribution — % of stores carrying it',
            s=>s.acvSeries||[], LAG, {zero:true, fmt:v=>(+v).toFixed(0)+'%'});
  out+=mini('Velocity — units per store, per week',
            s=>s.sppSeries||[], LAG, {zero:true, fmt:v=>(+v).toFixed(1),
    note:'⭐ Dollars can rise while THIS falls — that is distribution outrunning demand'});
  out+=mini('Coast distribution — the region that moves first',
            s=>s.coastSeries||[], LAG, {zero:true, fmt:v=>(+v).toFixed(0)+'%'});
  /* ⭐⭐ WEEKLY UNITS FOR EVERY SELECTION, not only the ones we already sell.
     ⛔ But they are DIFFERENT KINDS OF NUMBER and must never look alike:
        ours      — MEASURED, our real weekly order history, solid line
        candidate — PROJECTED, one rate we have not observed, DASHED and flat,
                    drawn across the same weeks with its p10-p90 band
        market    — nothing honest to draw; we do not sell it and there is no
                    projection for it, so it is named as absent, never as zero. */
  const wk=D.meta.our_weeks||[];
  const anyUnits=sel.some(s=>s.ourSeries||s.proj!=null);
  if(anyUnits && wk.length){
    const N=wk.length;
    const unitsFor=s=>{
      if(s.ourSeries) return s.ourSeries;
      if(s.proj!=null) return new Array(N).fill(s.proj);   // a flat projected rate
      return [];
    };
    // the projection's uncertainty, drawn behind the lines
    let band='';
    sel.forEach((s,k)=>{ if(s.ourSeries||s.projLo==null||s.projHi==null) return;
      band+='<!--band-->'; });
    out+=mini('Weekly units — ours measured, candidates projected', unitsFor,
              [wk[0]||'', wk[N-1]||''],
              {h:104, zero:true, projected:s=>!s.ourSeries&&s.proj!=null,
               fmt:v=>(+v).toFixed(v>=10?0:1)});
    const proj=sel.filter(s=>!s.ourSeries&&s.proj!=null);
    const none=sel.filter(s=>!s.ourSeries&&s.proj==null);
    out+='<div class="small mut" style="margin-top:-2px">'+
      'Solid = our real order history. <b>Dashed = a projection</b>, flat because it is '+
      'one rate, not a history'+
      (proj.length?' ('+proj.map(s=>esc((s.desc||'').slice(0,16))+': '+
        (+s.proj).toFixed(1)+'/wk'+(s.projLo!=null&&s.projHi!=null
          ?' , likely '+(+s.projLo).toFixed(1)+'-'+(+s.projHi).toFixed(1):'')).join('; ')+')':'')+
      (none.length?' \u26d4 '+none.length+' market item(s) have no line — we do not sell '+
        'them and there is no projection, which is not the same as zero.':'')+
      '</div>'+shapeKey();
    if(sel.some(s=>s.ourHH))
      out+=mini('OUR weekly households buying it', s=>s.ourHH||[],
                [wk[0]||'', wk[N-1]||''], {h:80, zero:true,
        note:'Breadth of demand \u2014 one household buying 20 is not 20 households. '+
             '\u26a0\ufe0f Only for items we already sell; there is no household '+
             'projection for a candidate.'});
  }
  return out;
}

/* ⭐ TRI-STATE, NEVER A TICKBOX. SPINS' "NOT CERTIFIED" means *not coded as
   positive*, and "SUBCATEGORY NOT CODED"/"UNKNOWN" mean nobody looked. Showing
   either as "no" invents a fact about the product. */
function attrVal(r,key){
  const ks=VOC.attrKeys||[], i=ks.indexOf(key);
  if(i<0||!r.attrs) return null;
  const v=r.attrs[i]; return v==null?null:(VOC.attrVals||[])[v];
}
const NOT_CODED=/NOT CODED|UNKNOWN|^NULSUB$/i;
function flagChip(r,key,label,goodIsN){
  const v=attrVal(r,key);
  if(v==null||NOT_CODED.test(v))
    return '<span class="chip small" style="color:var(--ink-3);cursor:default">'+
           label+': not coded</span>';
  const yes=/^Y$/i.test(v)||/CERTIFIED (?!NOT)/i.test(v)&&!/^NOT /i.test(v);
  const good=goodIsN?!yes:yes;
  return '<span class="chip small" style="cursor:default;color:'+
    (good?'var(--good)':'var(--bad)')+'">'+label+': '+(yes?'yes':'no')+'</span>';
}
function seasonBadge(r){
  const f=r.seasonFlag==null?null:(VOC.seasonFlag||[])[r.seasonFlag];
  if(!f) return '';
  const m={'SEASON-PEAK-AHEAD':['⬆ season peak ahead','var(--good)'],
           'SEASON-TROUGH-AHEAD':['⬇ season trough ahead','var(--bad)'],
           'DECLINING':['⚠ declining','var(--bad)'],
           'NEW-ITEM':['new to the market','var(--ink-2)'],
           'STABLE':['stable','var(--ink-3)']}[f]||[f,'var(--ink-3)'];
  return '<span class="chip small" style="cursor:default;color:'+m[1]+'">'+m[0]+
    (r.seasonIdx!=null&&Math.abs(r.seasonIdx)>1.5?' ('+(+r.seasonIdx).toFixed(1)+'×)':'')+
    '</span>';
}
function perUnit(r){
  const b=priceBits(r), u=r.uom==null?null:(VOC.uom||[])[r.uom];
  if(b.price==null||!r.size||!u) return null;
  return money(b.price/r.size)+' / '+u.toLowerCase()+
         '  <span class="mut">('+r.size+u.toLowerCase()+' pack)</span>';
}
function row(l,val){return val==null||val===''?'':'<tr><td>'+l+'</td><td class="k">'+val+'</td></tr>';}
function detail(r){
  const B=VOC.mB||[], b=(r.mB||[]).map(i=>i==null?null:B[i]);
  const shelfInfo=SHELF[(VOC.sub||[])[r.sub]]||{};
  const chips='<div style="display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px">'+
    seasonBadge(r)+

      (/CONVENTIONAL/i.test(attrVal(r,'brand_position'))?'var(--bad)':'var(--good)')+'">'+
      esc(attrVal(r,'brand_position').toLowerCase())+'</span>':'')+
    flagChip(r,'labeled_organic','organic')+
    flagChip(r,'certified_non_gmo_project_verified','non-GMO')+
    flagChip(r,'ingredient_seed_oils','seed oils',true)+
    flagChip(r,'ingredient_artificial_colors','artif. colors',true)+
    flagChip(r,'ingredient_ultra_processed','ultra-processed',true)+
    '</div>';
  // ⛔ warnings about OUR OWN item come first — they are the reason to act
  const warn=(r.cutList?'<div class="note" style="margin:0 0 8px"><b>SPINS says: '+
      esc(r.cutList.rec||'')+'</b>'+(r.cutList.units12!=null?
      ' — '+r.cutList.units12+' units in 12 weeks for us.':'')+'</div>':'')+
    (r.priceFlag?'<div class="note" style="margin:0 0 8px"><b>⚠️ '+esc(r.priceFlag.flag||'')+
      '</b>'+(r.priceFlag.over!=null?' — we are <b>'+Math.round(r.priceFlag.over)+
      '% over</b> the market average of '+money(r.priceFlag.spinsAvg)+'.':'')+'</div>':'');
  return '<h2 style="margin-top:15px">'+esc(r.desc||'')+'</h2>'+warn+chips+'<table>'+
    row('Brand',esc(v(r,'brand')||''))+row('Shelf',esc(v(r,'sub')||''))+
    row('Stores carrying',r.acv==null?null:(+r.acv).toFixed(1)+'%')+
    row('&nbsp;&nbsp;a year ago',r.acvYago==null?null:(+r.acvYago).toFixed(1)+'%')+
    row('Distribution trend',r.acvG==null?null:pct(r.acvG))+
    row('Units/store/wk trend',r.sppG==null?null:pct(r.sppG))+
    row('Market price',money(r.mktPrice))+row('Price trend',r.priceG==null?null:pct(r.priceG))+
    row('Weeks selling (of 4)',r.wkSell)+row('Coast lead',r.coastLead==null?null:(+r.coastLead).toFixed(1)+' pts')+
    row('Brand distribution',r.brandAcv==null?null:(+r.brandAcv).toFixed(1)+'%')+
    row('Market age',r.age==null?null:esc(String(v(r,'age')??r.age)))+
    row('Price per unit',perUnit(r))+
    row('Rank on this shelf',r.subRank==null?null:'#'+Math.round(r.subRank))+
    row('SPINS market score',r.mScore==null?null:(+r.mScore).toFixed(2))+
    (b.filter(Boolean).length?row('&nbsp;&nbsp;why',esc(b.filter(Boolean).join(' · '))):'')+
    (r.pop==='ours'?row('Our price',money(r.ourPrice))+
      row('On sale at',r.ourSale==null?null:money(r.ourSale))+
      row('Our cost',money(r.ourCost))+
      row('Our margin',r.ourMargin==null?null:(r.ourMargin*100).toFixed(0)+'%')+
      row('Market price/unit',money(r.mktUnitPrice))+
      row('Our units 12wk',r.ourUnits12):'')+
    (r.pop==='candidate'?row('Rank this week','#'+r.rank)+
      row('Estimated retail',money(r.price))+
      row('Cost',money(r.cost))+row('Margin at that price',r.margin==null?null:(r.margin*100).toFixed(0)+'%')+
      row('Projected units/wk',r.proj==null?null:(+r.proj).toFixed(1))+
      row('Chance it clears the bar',r.pClears==null?null:Math.round(r.pClears*100)+'%'):'')+
    '</table>'+
    (r.whatItIs?'<p class="small mut" style="margin-top:8px">'+esc(r.whatItIs)+'</p>':'')+
    // ⭐ THE INCUMBENT A NEW ITEM MUST BEAT. ⛔ Where our own brand already owns the
    // shelf, a new item competes with US, which is a different decision entirely.
    (shelfInfo.bestItem?'<div class="note" style="margin-top:9px"><b>On this shelf we '+
      'already sell</b> '+shelfInfo.skus+' item(s). Best: <b>'+esc(shelfInfo.bestItem)+
      '</b> ('+esc(shelfInfo.bestBrand||'')+') at '+money(shelfInfo.bestPrice)+
      ', '+(+shelfInfo.bestUnitsWk).toFixed(1)+' units/wk.'+
      (shelfInfo.ownShare!=null&&shelfInfo.ownShare>0.5?
        ' ⛔ <b>'+Math.round(shelfInfo.ownShare*100)+'% of this shelf is our OWN brand</b> — '+
        'a new item here competes with us, not with the market.':'')+
      (shelfInfo.ncOverCoast!=null?' Region index '+(+shelfInfo.ncOverCoast).toFixed(2)+
        (shelfInfo.ncOverCoast<0.7?' — this shelf under-indexes here.':
         shelfInfo.ncOverCoast>1.3?' — this shelf over-indexes here.':''):'')+
      '</div>':'');
}

      return '<td>'+esc(x??'—')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
